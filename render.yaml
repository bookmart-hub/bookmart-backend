services:
  - type: web
    name: bookmart-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: bookmart-postgres
          property: connectionString

databases:
  - name: bookmart-postgres
    plan: free
    databaseName: bookmart_db
    user: bookmart_user
